<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add expense · Kharcha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><div class="inner"><div class="brand">Kharcha<small>daily expense tracker</small></div><nav class="tabs" aria-label="Main"><a href="/index.html" aria-current="page">Add expense</a><a href="/transactions.html">Transactions</a><a href="/analysis.html">Analysis</a></nav></div></header>
<main>
  <h1 class="page-title">What did you spend?</h1>
  <p class="page-sub">Saved to MongoDB, then you land on the day's transactions.</p>

  <form id="expense-form" class="panel" novalidate>
    <div class="amount-box">
      <span class="rupee" aria-hidden="true">₹</span>
      <input id="amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0" aria-label="Amount in rupees" required autofocus>
    </div>

    <div class="form-grid">
      <div class="full">
        <label class="field" for="title">What was it for?</label>
        <input class="input" id="title" name="title" maxlength="80" placeholder="e.g. Lunch at canteen" required>
      </div>

      <div class="full">
        <span class="field" id="cat-label">Category</span>
        <div class="chips" id="cats" role="radiogroup" aria-labelledby="cat-label"></div>
      </div>

      <div>
        <label class="field" for="paymentMethod">Paid with</label>
        <select class="input" id="paymentMethod" name="paymentMethod"></select>
      </div>

      <div>
        <label class="field" for="date">Date</label>
        <input class="input" type="date" id="date" name="date" required>
      </div>

      <div class="full">
        <label class="field" for="note">Note (optional)</label>
        <textarea class="input" id="note" name="note" maxlength="300" placeholder="Anything worth remembering"></textarea>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn primary" type="submit" id="save-btn">Save expense</button>
      <span class="form-error" id="form-error" role="alert"></span>
    </div>
  </form>
</main>
<script src="/js/common.js"></script>
<script src="/js/add.js"></script>
</body>
</html>
